name: Release

on:
  push:
    tags:
      - "v*"
  # A tag push is the normal trigger, but it is the only one - so an Actions
  # outage at the wrong moment leaves a tag with no release and no way to build
  # one. Dispatching with the tag name does exactly what pushing it would have.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.19.0"
        required: true
        type: string

jobs:
  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          # On a tag push this is already the tag; on a dispatch it is whatever
          # branch was selected, so the tag has to be named explicitly.
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Crystal
        env:
          HOMEBREW_NO_INSTALL_UPGRADE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew update && brew install crystal || true
      - name: Install dependencies
        run: shards install --production --ignore-crystal-version
      - name: Build the binary
        run: |
          export LLVM_CONFIG="$(brew --prefix llvm)/bin/llvm-config"
          shards build crystalline --release --no-debug -Dpreview_mt --stats --progress --ignore-crystal-version
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: crystalline_${{ matrix.arch }}-apple-darwin
          path: ./bin/crystalline
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build the static binary
        run: docker build -t crystalline .
      - name: Copy binary to host
        run: |
          docker run -v $PWD:/app/host --rm crystalline:latest cp ./bin/crystalline ./host/crystalline
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: crystalline_x86_64-unknown-linux-musl
          path: ./crystalline
  release:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    # This repository grants workflows read access by default, which is enough to
    # build and upload artifacts but not to publish a release - without this the
    # job fails at the last step, after every binary has already been built.
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: ./artifacts
      - name: Compress and rename artifacts
        run: |
          gzip -r ./artifacts
          mv ./artifacts/crystalline_x86_64-unknown-linux-musl/crystalline.gz ./artifacts/crystalline_x86_64-unknown-linux-musl.gz
          mv ./artifacts/crystalline_x86_64-apple-darwin/crystalline.gz ./artifacts/crystalline_x86_64-apple-darwin.gz
          mv ./artifacts/crystalline_arm64-apple-darwin/crystalline.gz ./artifacts/crystalline_arm64-apple-darwin.gz
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.0
        with:
          # `github.ref_name` is the tag on a tag push, but the branch on a
          # dispatch, which would publish a release against the wrong ref.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ./artifacts/crystalline_x86_64-unknown-linux-musl.gz
            ./artifacts/crystalline_x86_64-apple-darwin.gz
            ./artifacts/crystalline_arm64-apple-darwin.gz
