name: Specs

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  specs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.20.0 cannot build this project: compiling its own `src/log/dispatch.cr`
        # with `-Dpreview_mt` fails with "type must be Nil, not (IO | Nil)". The
        # static Linux build has always pinned 1.20.2, which does not have the bug.
        crystal: [1.20.2, 1.21.0]
    steps:
      - name: Download source
        uses: actions/checkout@v6.0.2
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1.9.2
        with:
          crystal: ${{ matrix.crystal }}
      - name: Install dependencies
        run: shards install --ignore-crystal-version
      - name: Build executable
        run: shards build crystalline --no-debug -Dpreview_mt
      - name: Run tests
        run: crystal spec
